id: spring-security
name: Spring Security
aliases: []
runs_in_app: true
layer: auth
summary: Authentication and access-control framework for Java and Spring applications, with OAuth 2.0 login and SAML 2.0 support.
url: https://spring.io/projects/spring-security
license: Apache-2.0
languages: [java, kotlin]
tags: [social-login, enterprise-sso]
hosting: [self-hosted]
pricing: [oss]
maturity: established
good_for: [Securing Spring Boot and other Spring-based applications]
avoid_when: [Your backend is not on the JVM]
edges:
- {type: alternative-to, target: auth0}
- {type: alternative-to, target: keycloak}
- {type: alternative-to, target: zitadel}
- {type: pairs-with, target: spring-boot}
verified: '2026-11-14'
sources: ['https://spring.io/projects/spring-security', 'https://docs.spring.io/spring-security/reference/index.html', 'https://github.com/spring-projects/spring-security']
