- type: alternative-to
  target: bitbucket-pipelines
- type: alternative-to
  target: azure-pipelines
- type: alternative-to
  target: dagger
- type: pairs-with
  target: github-pages
- type: pairs-with
  target: playwright
- type: pairs-with
  target: cypress
- {type: pairs-with, target: vercel}
- {type: pairs-with, target: expo}
- {type: pairs-with, target: tauri}
