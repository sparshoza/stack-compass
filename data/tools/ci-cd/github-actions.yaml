id: github-actions
name: GitHub Actions
aliases:
- gha
- gh actions
- github workflows
layer: ci-cd
summary: CI/CD platform built into GitHub that runs workflows on GitHub-hosted or self-hosted runners.
url: https://github.com/features/actions
license: Proprietary
languages:
- go
- java
- csharp
- javascript
- python
- ruby
- rust
- swift
tags:
- scheduled-jobs
hosting:
- managed
- self-hosted
pricing:
- free-tier
- paid
maturity: established
good_for:
- Projects hosted on GitHub
- Free standard runners for public repositories
avoid_when:
- Your code lives on another Git host
edges:
- type: alternative-to
