id: astro
name: Astro
aliases:
- astrojs
layer: meta-framework
summary: A web framework for content-driven sites that ships minimal JavaScript and mixes UI libraries.
url: https://astro.build
repo: https://github.com/withastro/astro
license: MIT
languages:
- javascript
- typescript
tags:
- static-content
- ssr-seo
- type-safety
hosting:
- self-hosted
