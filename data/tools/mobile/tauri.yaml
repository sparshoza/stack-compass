id: tauri
name: Tauri
aliases:
- tauri-app
- tauri2
layer: mobile
summary: A framework for building desktop and mobile apps with a web frontend, a Rust core and the system webview.
url: https://tauri.app
repo: https://github.com/tauri-apps/tauri
license: Apache-2.0 OR MIT
languages:
- rust
- javascript
- typescript
tags:
- native-mobile
hosting:
- self-hosted
pricing:
- oss
maturity: established
good_for:
- Small apps with a web UI and Rust backend
avoid_when:
- You need the same rendering engine on every platform, since Tauri uses the system webview
edges:
- type: alternative-to
  target: capacitor
- type: pairs-with
  target: svelte
- type: pairs-with
  target: react
- {type: pairs-with, target: nextjs}
- {type: pairs-with, target: postgresql}
- {type: pairs-with, target: github-actions}
- {type: pairs-with, target: mysql}
- {type: pairs-with, target: vitest}
- {type: pairs-with, target: sqlite}
verified: '2026-11-14'
sources:
- https://tauri.app
- https://github.com/tauri-apps/tauri
- https://tauri.app/blog/tauri-20/
- https://v2.tauri.app/start/frontend/nextjs/
- https://v2.tauri.app/plugin/sql/
- https://v2.tauri.app/distribute/pipelines/github/
- https://v2.tauri.app/develop/tests/mocking/
