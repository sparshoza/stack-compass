- {type: alternative-to, target: sequelize}
- {type: alternative-to, target: typeorm}
- {type: pairs-with, target: mysql}
- {type: pairs-with, target: neon}
- {type: pairs-with, target: postgresql}
- {type: pairs-with, target: sqlite}
- {type: pairs-with, target: turso}
verified: 2026-11-14
sources: ['https://orm.drizzle.team', 'https://github.com/drizzle-team/drizzle-orm']
