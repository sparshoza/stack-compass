        - {id: uptime, label: Uptime checks, hint: Alerts when your site goes down}
  testing:
    - id: need
      question: What do you need it for?
      multi: true
      options:
        - {id: unit, label: Unit tests, hint: Check small pieces of code on their own}
        - {id: browser, label: Browser tests, hint: Click through the app in a real browser}
        - {id: components, label: Component tests, hint: Test screens the way a user sees them}
        - {id: api, label: API tests, hint: Send requests and check the answers}
        - {id: load, label: Load tests, hint: See how the app holds up under heavy traffic}
