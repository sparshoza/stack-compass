<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stack Compass: pick a full stack, see why</title>
    <meta name="description" content="Describe your project or answer a few questions and get one tool per layer, with reasons, on a map of the tools and how they relate." />
    <meta property="og:title" content="Stack Compass: pick a full stack, see why" />
    <meta property="og:description" content="Describe your project or answer a few questions and get one tool per layer, with reasons, on a map of the tools and how they relate." />

    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var theme = 'dark'
        try {
          var saved = window.localStorage.getItem('stack-compass-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
